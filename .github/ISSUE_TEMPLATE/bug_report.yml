name: Bug report
description: Report a reproducible, non-sensitive problem using synthetic data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        This is a public issue. Do not include names, student IDs, emails, documents, backups, local paths, credentials, or private screenshots.
        Serious vulnerabilities belong in the private channel described in SECURITY.md. No source license has been selected.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Describe the problem without personal academic information.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use an empty workspace, the labelled demo, or synthetic inputs.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App build, browser and screen size
      placeholder: "Beta build, Chrome, 390px viewport"
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report check
      options:
        - label: This report contains no personal data, private documents, credentials, or sensitive vulnerability details.
          required: true
